title = "The Initiative"
headline = "Empowering Middle School STEM"
paragraphs = [
  "The Riverside STEM Partner Program is a flexible support model for schools interested in starting or strengthening rigorous STEM opportunities. The goal is to lower the activation energy for teachers and administrators by sharing guidance, planning materials, coaching resources and collaborative support."
]

