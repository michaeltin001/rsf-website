title = "Our Support"
items = [
  "Start-up guidance and planning conversations",
  "Sample agendas, calendars, coaching materials, and student resources",
  "Collaboration with experienced program leads",
  "Support identifying realistic first-year goals",
  "Guidance for recruitment and family communication",
  "Competition preparation models and judging practice structures",
  "Connections with other schools building similar programs",
  "Possible mentor support from partner organizations"
]

[timeline]
headline = "The Roadmap"
sub_headline = "Four Levels of Development"

[[timeline.levels]]
level = "1"
title = "Offering"
text = "Create an initial opportunity for interested students."

[[timeline.levels]]
level = "2"
title = "Structured Support"
text = "Build consistency with planning tools, guidance, and shared resources."

[[timeline.levels]]
level = "3"
title = "Access for Broader Participation"
text = "Expand access through recruitment, communication, and beginner-friendly entry points."

[[timeline.levels]]
level = "4"
title = "Building High-Level Program Capacity"
text = "Grow long-term excellence through coaching, leadership, volunteer networks, and year-to-year continuity."

[grant_callout]
title = "TAiSE Grant Support"
body = "Riverside STEM Foundation may be able to provide TAiSE grants (Teacher Appreciation in STEM Education) as school-site matching grants while funding lasts. These grants may help support substitute time or hourly pay for teachers working to launch or strengthen STEM programs."
disclaimer = "Funding availability and award amounts depend on available funds, site readiness, and alignment with program goals."

