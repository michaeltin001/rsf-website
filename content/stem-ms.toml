[initiative]
title = "The Initiative"
headline = "Empowering Middle School STEM"
paragraphs = [
  "Building a STEM program from scratch—or expanding an existing one—takes time and resources. In partnership with the Riverside STEM Foundation, Delta SIFY, and the Riverside STEM Academy, we are offering a comprehensive resource-sharing initiative designed to kickstart STEM clubs at your middle school.",
  "Designed specifically as professional development for educators, our goal is to provide you with the curriculum, practice materials, and structural support you need. There are no mandatory commitments, no rigid deadlines, and no hidden expectations. Use what works for your classroom."
]

