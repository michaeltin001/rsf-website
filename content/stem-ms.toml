[timeline]
headline = "The Roadmap"
sub_headline = "See a sample timeline for the school year."

[[timeline.programs]]
name = "Math Clubs"

[[timeline.programs.items]]
period = "August – September"
title = "Program Kickoff"
description = "Access the math portal, recruit students, and introduce basic competition formats and problem-solving strategies."

[[timeline.programs.items]]
period = "October – December"
title = "Skill Building"
description = "Hold weekly sessions using our provided MATHCOUNTS and Math Olympiad practice sets to build speed and accuracy."

[[timeline.programs.items]]
period = "January – February"
title = "MATHCOUNTS Season"
description = "Participate in school-level and chapter-level MATHCOUNTS competitions. Review advanced concepts."

[[timeline.programs.items]]
period = "March – May"
title = "Math Olympiad & Wrap-up"
description = "Complete the final Math Olympiad exams, celebrate student growth, and review the year's progress."

[[timeline.programs]]
name = "Science Olympiad"

[[timeline.programs.items]]
period = "August – September"
title = "Team Formation"
description = "Recruit students, review the event rulebooks, and assign students to specific study and build events."

[[timeline.programs.items]]
period = "October – December"
title = "Study & Build Phase"
description = "Utilize our structured syllabus, weekly lectures, and practice exams to prepare for individual events."

[[timeline.programs.items]]
period = "January – February"
title = "Invitational Practice"
description = "Participate in local invitational tournaments to test builds and take practice exams under competition conditions."

[[timeline.programs.items]]
period = "March"
title = "Regional Competition"
description = "Compete in the official Inland Empire Regional Science Olympiad tournament."

[[timeline.programs]]
name = "Robotics"

[[timeline.programs.items]]
period = "August – September"
title = "Kit Setup & Basics"
description = "Unbox the FIRST LEGO kits, install software, and use our interactive curriculum to teach basic programming."

[[timeline.programs.items]]
period = "October – November"
title = "Mission Strategy"
description = "Analyze the season's challenge mat, brainstorm robot designs, and begin coding solutions for specific missions."

[[timeline.programs.items]]
period = "December – January"
title = "Refinement & Practice"
description = "Troubleshoot code, rebuild mechanisms for reliability, and run timed 2.5-minute practice matches."

[[timeline.programs.items]]
period = "February – March"
title = "FLL Tournaments"
description = "Present the team's innovation project and compete in the robot game at local FIRST LEGO League qualifiers."

[[timeline.programs]]
name = "Science Fair"

[[timeline.programs.items]]
period = "August – September"
title = "Topic Selection"
description = "Guide students through brainstorming, selecting a testable question, and beginning background research."

[[timeline.programs.items]]
period = "October – November"
title = "Experimentation"
description = "Students finalize their experimental design, gather materials, and conduct their actual experiments/data collection."

[[timeline.programs.items]]
period = "December – January"
title = "Analysis & Boards"
description = "Analyze the collected data, write conclusions, and design the physical presentation boards."

[[timeline.programs.items]]
period = "February"
title = "RUSD District Fair"
description = "Students present their projects to judges at the official RUSD District Science and Engineering Fair."

[faq]
headline = "Common Questions"
sub_headline = "Everything you need to know before getting started."

[[faq.items]]
question = "Do I need a background in STEM to advise a club?"
answer = "Not at all! Our curriculum is highly beginner-friendly and designed to guide both you and your students step-by-step."

[[faq.items]]
question = "Is there any financial cost to my school?"
answer = "The curriculum, practice exams, and structural resources provided through this collaboration are 100% free to RUSD educators."

[[faq.items]]
question = "How much time per week will this require from me?"
answer = "The resources are modular. Most teachers run a 1-hour club meeting once a week, and our 'ready-to-go' materials keep prep time minimal."

[[faq.items]]
question = "Can I use the resources but skip the actual competitions?"
answer = "Absolutely. There are no mandatory commitments. Use the modules that work for your classroom, even if that just means exploring concepts."

[contact]
headline = "Ready to bring these resources to your school?"
body = "Our partnership kicks off in August. Because there is no formal application process or binding commitment, getting started is simple. Reach out today to gain access to the curriculum."

