content = "The Riverside STEM Foundation (RSF) is a registered <span class=\"text-accent font-semibold\">501(c)(3) non-profit</span> corporation dedicated to supporting STEM education across the Inland Empire region.<br/><br/>Our Board of Directors is a diverse coalition united by a single goal: empowering the next generation of innovators."
