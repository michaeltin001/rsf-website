type = "scioly-resources"
title = "Science Olympiad Resources"
main_sheet_id = "1Dcs6HDWLj5MyOtFPSQ4YD8X225QYl7SKQhXdT1xD_O8"
paragraphs = [
  "This is the resources page for the Science Olympiad Coaching Program at [Riverside STEM Academy](https://stemacademy.riversideunified.org/), run in collaboration with [Change in Scientific Importance for Youth (Delta SIFY)](https://www.deltasify.org/). Our program focuses on the 23 Division B events, specifically the 17 non-build events. We will post all the resources that our coaches make for teaching on a week-by-week basis over the course of the season in a \"syllabus\" format. These resources include, but are not limited to, lecture slides, assignments, exams, and hands-on activities.",
  "Updates will be published every Monday at around 5:00 PM. While these materials are designed with in-person coaching in mind, anybody is welcome to use this content to study for the Science Olympiad season. As a disclaimer, that these are volunteer-made resources and are not affiliated with Science Olympiad.",
  "To get started, please refer to the list of events below. You can click on any specific event to see its current syllabus."
]

